<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Media Chat</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body, html { height: 100%; width: 100%; overflow: hidden; background: #e5ddd5; }

    #authOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; color: white; padding: 20px; text-align: center; }

    #appContainer { display: flex; height: 100vh; width: 100vw; }

    #sidebar { width: 280px; background: #ffffff; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; }
    .sidebar-header { background: #075e54; color: white; padding: 15px; font-weight: bold; }
    .online-users-list { flex: 1; overflow-y: auto; padding: 10px; }
    .user-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #f0f0f0; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .user-card:hover { background: #f0f2f5; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .user-info { display: flex; flex-direction: column; flex: 1; }
    .user-name { font-size: 13px; font-weight: 600; color: #111b21; }
    .btn-chat-user { padding: 4px 8px; font-size: 11px; background: #25D366; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-chat-user:hover { background: #1ebd5e; }

    #chatWindow { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
    .chat-header { background: #f0f2f5; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d1d7db; }
    .header-actions { display: flex; align-items: center; gap: 15px; }
    .notif-bell-btn { font-size: 20px; background: none; border: none; cursor: pointer; position: relative; }
    .typing-indicator { font-size: 12px; color: #667781; font-style: italic; }

    .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message-row { display: flex; width: 100%; flex-direction: column; }
    .message-row.sent { align-items: flex-end; }
    .message-row.received { align-items: flex-start; }

    .message-bubble { max-width: 65%; padding: 8px 12px; border-radius: 8px; background: #fff; position: relative; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .message-row.sent .message-bubble { background: #d9fdd3; }
    
    .message-header { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: #667781; margin-bottom: 4px; }
    .reply-box { background: rgba(0,0,0,0.06); border-left: 4px solid #075e54; padding: 4px 8px; margin-bottom: 6px; border-radius: 4px; font-size: 12px; }
    
    .media-thumb { max-width: 100%; max-height: 250px; border-radius: 6px; margin-top: 6px; display: block; object-fit: contain; }
    video.media-thumb { width: 100%; background: #000; }

    .message-actions { display: flex; gap: 8px; margin-top: 6px; font-size: 11px; cursor: pointer; color: #027eb5; }
    .delete-action { color: #d32f2f; font-weight: bold; }

    .chat-input-bar { background: #f0f2f5; padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
    .chat-input-bar input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    .btn-action { padding: 10px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 5px; background: #25D366; color: white; font-weight: bold; }

    #replyBanner { background: #e9edef; padding: 6px 15px; display: none; justify-content: space-between; align-items: center; font-size: 12px; border-left: 4px solid #075e54; }

    .drawer { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: #fff; box-shadow: -2px 0 5px rgba(0,0,0,0.2); transition: 0.3s; z-index: 1500; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .drawer.open { right: 0; }
    .admin-section { background: #ffebee; border: 1px solid #ffcdd2; padding: 10px; border-radius: 4px; display: none; }
  </style>
</head>
<body>

  <!-- Authentication Overlay -->
  <div id="authOverlay">
    <h2 style="margin-bottom: 10px;">Chat Application</h2>
    <p style="margin-bottom: 20px; font-size:14px; color:#ccc;">Sign in with your Google account to access the workspace.</p>
    
    <div id="g_id_onload"
         data-client_id="662211431142-f3leej84i7q62krb901i099ql9f41g2h.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
  </div>

  <!-- Main App Window -->
  <div id="appContainer">
    <div id="sidebar">
      <div class="sidebar-header">Online Users</div>
      <div class="online-users-list" id="onlineUsersList"></div>
    </div>

    <div id="chatWindow">
      <div class="chat-header">
        <div>
          <h3>Global Workspace</h3>
          <span class="typing-indicator" id="typingIndicator"></span>
        </div>
        <div class="header-actions">
          <button class="notif-bell-btn" id="notifBell" onclick="handleNotificationClick()" title="Notification Settings">🔔</button>
          <button style="font-size:20px; background:none; border:none; cursor:pointer;" onclick="toggleDrawer()">&#9776;</button>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div id="replyBanner">
        <span id="replyBannerText"></span>
        <button style="border:none; background:none; cursor:pointer;" onclick="cancelReply()">✕</button>
      </div>

      <div class="chat-input-bar">
        <input type="file" id="fileInput" style="display:none;" accept="image/*,video/*,audio/*,application/pdf" onchange="handleFileUpload(event)">
        <button class="btn-action" style="background:#54656f;" onclick="document.getElementById('fileInput').click()" title="Attach Media">📎</button>
        <input type="text" id="messageInput" placeholder="Type a message..." oninput="handleTyping()">
        <button class="btn-action" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Side Settings Drawer -->
  <div id="sideDrawer" class="drawer">
    <div style="display:flex; justify-content:space-between; border-bottom:1px solid #ccc; padding-bottom:10px;">
      <h3>User Settings</h3>
      <button style="border:none; background:none; font-size:18px; cursor:pointer;" onclick="toggleDrawer()">✕</button>
    </div>

    <div>
      <label style="font-size:12px;">Display Name:</label>
      <input type="text" id="editUsername" style="width:100%; padding:8px; margin:5px 0 10px 0;">
      <label style="font-size:12px;">Avatar Image URL:</label>
      <input type="text" id="editAvatar" style="width:100%; padding:8px; margin:5px 0 10px 0;">
      <button class="btn-action" style="width:100%; background:#075e54;" onclick="updateProfile()">Save Profile</button>
    </div>

    <div id="adminPanel" class="admin-section">
      <h4 style="color:#d32f2f;">Admin Dashboard</h4>
      <p style="font-size:11px; margin-bottom:8px;">You have master privileges to delete any content.</p>
      <button class="btn-action" style="width:100%; background:#d32f2f;" onclick="adminClearChat()">Purge All Room Messages</button>
    </div>

    <div style="margin-top: auto;">
      <button class="btn-action" style="width:100%; background:#555;" onclick="signOutUser()">Sign Out</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDPyL4sPgVhwQx93ArDgUFXH3PKlqL5Kfc",
      authDomain: "mycloud-86247.firebaseapp.com",
      databaseURL: "https://mycloud-86247-default-rtdb.firebaseio.com",
      projectId: "mycloud-86247",
      storageBucket: "mycloud-86247.firebasestorage.app",
      messagingSenderId: "662211431142",
      appId: "1:662211431142:web:61de5d726aedf071160927",
      measurementId: "G-Z3WLVE5BB5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhoJ4bbwic06RBBnpgS_MUi_h4MNnT13McrawjdCtMRWMzBULzC6A2FBKQVDTgFXJxJQ/exec";

    let currentUser = { uid: null, name: "User", avatar: "https://via.placeholder.com/40", isAdmin: false };
    let replyTarget = null;
    let typingTimeout = null;

    // JWT Token Parser for Google Credentials
    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      return JSON.parse(jsonPayload);
    }

    // RESTORE SAVED SESSION ON LOAD
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('chatUserSession');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        setupUserSession();
      }
    });

    function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);
      
      currentUser.uid = "google_" + payload.sub;
      currentUser.name = payload.name;
      currentUser.avatar = payload.picture;

      if (payload.email && payload.email.includes("admin")) {
        currentUser.isAdmin = true;
      }

      localStorage.setItem('chatUserSession', JSON.stringify(currentUser));
      setupUserSession();
    }

    function setupUserSession() {
      if (currentUser.isAdmin) {
        document.getElementById('adminPanel').style.display = 'block';
      }

      document.getElementById('editUsername').value = currentUser.name;
      document.getElementById('editAvatar').value = currentUser.avatar;
      document.getElementById('authOverlay').style.display = 'none';

      initializePresence();
      listenForMessages();
      listenForUsers();
    }

    function signOutUser() {
      localStorage.removeItem('chatUserSession');
      if (currentUser.uid) {
        db.ref('status/' + currentUser.uid).remove();
      }
      location.reload();
    }

    // ONLINE PRESENCE
    function initializePresence() {
      const userStatusRef = db.ref('status/' + currentUser.uid);
      db.ref('.info/connected').on('value', (snapshot) => {
        if (snapshot.val() === false) return;
        userStatusRef.onDisconnect().remove().then(() => {
          userStatusRef.set({ state: 'online', name: currentUser.name, avatar: currentUser.avatar });
        });
      });
    }

    function listenForUsers() {
      db.ref('status').on('value', (snapshot) => {
        const usersList = document.getElementById('onlineUsersList');
        usersList.innerHTML = '';
        snapshot.forEach((childSnapshot) => {
          const val = childSnapshot.val();
          // Exclude self from user list
          if (val.state === 'online' && childSnapshot.key !== currentUser.uid) {
            const div = document.createElement('div');
            div.className = 'user-card';
            div.onclick = () => initiateDirectChat(val.name);
            div.innerHTML = `
              <img src="${val.avatar}" class="user-avatar" alt="avatar">
              <div class="user-info">
                <span class="user-name">${val.name}</span>
              </div>
              <button class="btn-chat-user" onclick="event.stopPropagation(); initiateDirectChat('${val.name}')">Chat</button>
            `;
            usersList.appendChild(div);
          }
        });
      });
    }

    function initiateDirectChat(userName) {
      const input = document.getElementById('messageInput');
      input.value = `@${userName} `;
      input.focus();
    }

    // MESSAGES
    function sendMessage(mediaUrl = null, mimeType = null) {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text && !mediaUrl) return;

      const msgData = {
        senderId: currentUser.uid,
        senderName: currentUser.name,
        text: text,
        mediaUrl: mediaUrl,
        mimeType: mimeType,
        timestamp: Date.now(),
        replyTo: replyTarget ? replyTarget : null
      };

      db.ref('messages').push(msgData).catch(err => {
        alert("Sending failed: " + err.message);
      });

      input.value = '';
      cancelReply();
    }

    function listenForMessages() {
      db.ref('messages').on('child_added', (snapshot) => {
        renderMessage(snapshot.key, snapshot.val());
      });

      db.ref('messages').on('child_removed', (snapshot) => {
        const el = document.querySelector(`[data-id="${snapshot.key}"]`);
        if (el) el.remove();
      });
    }

    function renderMessage(id, msg) {
      const container = document.getElementById('messagesContainer');
      const isSent = msg.senderId === currentUser.uid;

      const row = document.createElement('div');
      row.className = `message-row ${isSent ? 'sent' : 'received'}`;
      row.setAttribute('data-id', id);

      let replyHTML = msg.replyTo ? `<div class="reply-box"><strong>${msg.replyTo.senderName}:</strong> ${msg.replyTo.text}</div>` : '';

      let mediaHTML = '';
      if (msg.mediaUrl) {
        if (msg.mimeType && msg.mimeType.startsWith('video/')) {
          mediaHTML = `<video src="${msg.mediaUrl}" controls class="media-thumb"></video>`;
        } else if (msg.mimeType && msg.mimeType.startsWith('image/')) {
          mediaHTML = `<img src="${msg.mediaUrl}" class="media-thumb" loading="lazy"/>`;
        } else {
          mediaHTML = `<a href="${msg.mediaUrl}" target="_blank" style="display:inline-block; margin-top:6px; color:#027eb5;">📎 View Attachment</a>`;
        }
      }

      const canDelete = isSent || currentUser.isAdmin;
      const deleteBtn = canDelete ? `<span class="delete-action" onclick="deleteMessage('${id}')">Delete</span> | ` : '';

      row.innerHTML = `
        <div class="message-bubble">
          <div class="message-header">
            <span>${msg.senderName}</span>
            <span>${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
          </div>
          ${replyHTML}
          <div>${msg.text}</div>
          ${mediaHTML}
          <div class="message-actions">
            ${deleteBtn}
            <span onclick="setReplyTarget('${msg.senderName}', '${msg.text || 'Media File'}')">Reply</span>
          </div>
        </div>
      `;

      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function deleteMessage(id) {
      if (confirm("Delete this message?")) {
        db.ref('messages/' + id).remove();
      }
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 25 * 1024 * 1024) {
        alert("File limit exceeded. Maximum size is 25MB.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const rawBytes = e.target.result.split(',')[1];
        
        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ filename: file.name, mimeType: file.type, fileData: rawBytes })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            const mediaUrl = `https://lh3.googleusercontent.com/d/${data.fileId}`;
            sendMessage(mediaUrl, data.mimeType);
          } else {
            alert("Upload failed: " + data.message);
          }
        })
        .catch(err => alert("Upload error: " + err));
      };
      reader.readAsDataURL(file);
    }

    function handleTyping() {
      if (!currentUser.uid) return;
      db.ref('typing/' + currentUser.uid).set({ name: currentUser.name });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        db.ref('typing/' + currentUser.uid).remove();
      }, 2000);
    }

    db.ref('typing').on('value', (snapshot) => {
      const indicator = document.getElementById('typingIndicator');
      let typers = [];
      snapshot.forEach(child => {
        if (child.key !== currentUser.uid) typers.push(child.val().name);
      });
      indicator.textContent = typers.length ? `${typers.join(', ')} is typing...` : '';
    });

    function setReplyTarget(name, text) {
      replyTarget = { senderName: name, text: text };
      document.getElementById('replyBannerText').textContent = `Replying to ${name}: "${text}"`;
      document.getElementById('replyBanner').style.display = 'flex';
    }

    function cancelReply() {
      replyTarget = null;
      document.getElementById('replyBanner').style.display = 'none';
    }

    function toggleDrawer() {
      document.getElementById('sideDrawer').classList.toggle('open');
    }

    function updateProfile() {
      currentUser.name = document.getElementById('editUsername').value;
      currentUser.avatar = document.getElementById('editAvatar').value;
      localStorage.setItem('chatUserSession', JSON.stringify(currentUser));
      db.ref('status/' + currentUser.uid).update({ name: currentUser.name, avatar: currentUser.avatar });
      alert("Profile updated!");
      toggleDrawer();
    }

    function adminClearChat() {
      if (confirm("ADMIN ACTION: Clear all room messages?")) {
        db.ref('messages').remove();
        document.getElementById('messagesContainer').innerHTML = '';
      }
    }

    function updateBellUI() {}
    function handleNotificationClick() {}
  </script>
</body>
</html>
